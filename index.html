@media (prefers-color-scheme:dark) and (min-width:99999px){:root:not([data-theme="light"]) .sea{background:linear-gradient(rgba(0,20,30,.55),rgba(0,20,30,.65)),var(--photo) center 62%/cover no-repeat,var(--bg)}}

.wrap{max-width:640px;margin:0 auto;padding:22px 18px 64px}
/* clay */
.glass{background:var(--c-main);border-radius:32px;-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1.5px solid rgba(255,255,255,.7);
  box-shadow:14px 14px 30px var(--out),-10px -10px 24px var(--far),
    inset 8px 8px 14px var(--hi),inset -8px -8px 16px var(--lo);
  transition:transform .25s ease,box-shadow .25s ease}
.glass:not(nav){position:relative}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 45%,rgba(255,255,255,.22))}
@media (hover:hover){
 .glass:not(nav):hover{transform:translateY(-5px);
  box-shadow:20px 22px 38px var(--out),-10px -10px 24px var(--far),inset 8px 8px 14px var(--hi),inset -8px -8px 16px var(--lo)}}
.glass:not(nav):active{transform:translateY(1px) scale(.995);
  box-shadow:6px 6px 14px var(--out),-4px -4px 10px var(--far),inset 10px 10px 18px var(--lo),inset -6px -6px 12px var(--hi)}
header{position:relative;padding:32px 24px 26px;margin-bottom:18px;background:var(--c-head)}
.shisa{position:absolute;top:54px;right:16px;width:clamp(96px,31%,130px);height:auto;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(10,90,110,.28))}
.date{font-size:.9rem;color:var(--sub);letter-spacing:.12em;margin:0}
h1{font-weight:700;font-size:2.4rem;line-height:1.25;margin:6px 0 16px;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.chips li{border-radius:99px;background:var(--c-chip);
  box-shadow:5px 5px 10px var(--out),-3px -3px 8px var(--far),inset 3px 3px 6px var(--hi),inset -3px -3px 6px var(--lo);font-size:.85rem;font-weight:500}
.chips a{color:inherit;text-decoration:none;display:block;padding:7px 16px;border-radius:99px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:7px;margin-bottom:18px;border-radius:99px}
nav button{flex:1;border:0;background:none;color:var(--ink);font:500 .95rem var(--sans);padding:11px 4px;border-radius:99px;cursor:pointer;transition:box-shadow .2s}
nav button[aria-selected="true"]{background:var(--pill);color:var(--pill-ink);font-weight:700;
  box-shadow:inset 3px 3px 6px rgba(255,255,255,.5),inset -3px -3px 7px rgba(0,60,70,.25),3px 3px 8px var(--out)}
button:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:3px}
section[hidden]{display:none}
.days{display:flex;gap:10px;margin-bottom:18px}
.days button{flex:1;padding:11px 4px;border-radius:24px;border:0;background:var(--c-chip);color:var(--ink);
  font:500 .85rem/1.35 var(--sans);cursor:pointer;
  box-shadow:6px 6px 12px var(--out),-4px -4px 10px var(--far),inset 3px 3px 6px var(--hi),inset -3px -3px 6px var(--lo);transition:transform .2s,box-shadow .2s}
@media (hover:hover){.days button:hover{transform:translateY(-3px)}}
.days button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);font-weight:700;
  box-shadow:inset 5px 5px 10px rgba(0,60,70,.28),inset -4px -4px 8px rgba(255,255,255,.45)}
.day{padding:24px 22px}
.day h2{font-size:1.35rem;line-height:1.45;margin:0 0 4px}
.day p.d{margin:0 0 16px;color:var(--sub);font-size:.9rem}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:4px solid rgba(255,255,255,.7);border-radius:4px}
.tl li{position:relative;display:flex;gap:12px;padding:6px 0}
.tl li::before{content:"";position:absolute;left:-29px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--c-chip);
  box-shadow:2px 2px 4px var(--out),inset 2px 2px 3px var(--hi),inset -2px -2px 3px var(--lo)}
.tl li.t::before{background:var(--pill)}
.tm{flex:0 0 3.7rem;font-weight:700;color:var(--accent);font-size:.92rem;font-variant-numeric:tabular-nums}
.tm.n{color:var(--sub);font-weight:400}
.pk{padding:24px 22px;margin-bottom:16px;background:var(--c-pack)}
.pk h2{font-size:1.2rem;margin:0 0 8px}
.pk label{display:flex;gap:14px;align-items:center;padding:8px 0;cursor:pointer}
.pk input{appearance:none;-webkit-appearance:none;width:28px;height:28px;flex:none;border-radius:10px;background:var(--c-main);
  box-shadow:inset 3px 3px 6px var(--lo),inset -3px -3px 6px var(--hi);display:grid;place-content:center;margin:0;transition:background .2s}
.pk input:checked{background:var(--pill);box-shadow:3px 3px 7px var(--out),inset 2px 2px 4px rgba(255,255,255,.55),inset -2px -2px 4px rgba(0,60,70,.25)}
.pk input:checked::after{content:"✓";color:var(--pill-ink);font-size:16px;font-weight:700}
.pk input:checked+span{opacity:.5;text-decoration:line-through}
.prog{padding:16px 22px;margin-bottom:16px;font-size:.9rem;background:var(--c-prog)}
.bar{height:14px;border-radius:99px;background:var(--c-main);margin-top:10px;overflow:hidden;box-shadow:inset 3px 3px 5px var(--lo),inset -2px -2px 4px var(--hi)}
.bar b{display:block;height:100%;width:0;background:var(--pill);border-radius:99px;transition:width .3s;box-shadow:inset 2px 2px 3px rgba(255,255,255,.5)}
.add{display:inline-block;padding:13px 28px;border-radius:99px;background:var(--pill);color:var(--pill-ink);font-weight:700;cursor:pointer;margin-bottom:10px;
  box-shadow:8px 8px 16px var(--out),-5px -5px 12px var(--far),inset 4px 4px 8px rgba(255,255,255,.5),inset -4px -4px 8px rgba(0,60,70,.22);transition:transform .2s}
@media (hover:hover){.add:hover{transform:translateY(-3px)}}
.add:active{transform:translateY(1px)}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.82rem;color:var(--sub);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid button{padding:0;border:0;border-radius:24px;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--c-main);
  box-shadow:7px 7px 14px var(--out),-5px -5px 10px var(--far);transition:transform .2s}
@media (hover:hover){.grid button:hover{transform:translateY(-3px)}}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.empty{padding:38px 22px;text-align:center;color:var(--sub);background:var(--c-prog)}
#lb{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(30,50,60,.8);padding:20px}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:100%;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#del{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);border:0;border-radius:99px;padding:12px 30px;background:#f4f1ee;color:#0b3f4a;font:700 .95rem var(--sans);cursor:pointer;box-shadow:6px 6px 14px rgba(0,0,0,.35),inset 3px 3px 6px #fff,inset -3px -3px 6px rgba(0,0,0,.15)}
#del.ask{background:#ff8f82}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

day(0);
let st={};try{st=JSON.parse(localStorage.getItem("ishigaki-pack")||"{}")}catch(e){}
$("#pl").innerHTML=P.map((c,i)=>`<div class="pk glass"><h2>${c[0]}</h2>`+c[1].map((n,j)=>`<label><input type="checkbox" data-k="${i}-${j}" ${st[i+"-"+j]?"checked":""}><span>${n}</span></label>`).join("")+`</div>`).join("");
function prog(){const a=[...document.querySelectorAll(".pk input")],n=a.filter(x=>x.checked).length;
 $("#pt").textContent=`準備 ${n} / ${a.length} 完了`;$("#pb").style.width=(n/a.length*100)+"%"}
$("#pl").onchange=e=>{st[e.target.dataset.k]=e.target.checked;try{localStorage.setItem("ishigaki-pack",JSON.stringify(st))}catch(x){}prog()};
prog();
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x==b));
 ["trip","pack","gal"].forEach(id=>$("#"+id).hidden=id!=b.dataset.tab);window.scrollTo(0,0)};
let db=null,assets=null,photos=[],local=[],sel=null;
function draw(){const a=[...photos.map(p=>({id:p.id,u:"/_blob/"+p.id})),...local];
 $("#g").innerHTML=a.map((p,i)=>`<button data-i="${i}"><img src="${p.u}" alt="旅行の写真"></button>`).join("");
 $("#ge").hidden=a.length>0;$("#gn").textContent=assets&&db?"追加した写真は保存されます。":"この環境では保存できないため、写真はこの画面を閉じるまで表示されます。";return a}
let list=[];
function render(){list=draw()}
render();
(async()=>{try{if(!window.claude)return;assets=await claude.use("assets");db=await claude.use("db");
 if(db)db.collection("photos").orderBy("at","desc").onSnapshot(s=>{photos=s.docs.map(d=>({id:d.id}));render()},()=>{});render()}catch(e){}})();
function shrink(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
 c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);r(b||f)},"image/jpeg",.85)};im.onerror=()=>r(f);im.src=u})}
$("#f").onchange=async e=>{const fs=[...e.target.files];e.target.value="";$("#gn").textContent="保存中…";
 for(const f of fs){try{if(assets&&db){const b=await shrink(f),r=await assets.upload(b);await db.collection("photos").doc(r.id).set({at:Date.now()})}
  else local.push({id:null,u:URL.createObjectURL(f)})}catch(x){local.push({id:null,u:URL.createObjectURL(f)})}}
 render()};
$("#g").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=list[+b.dataset.i];$("#lb img").src=sel.u;
 $("#del").textContent="削除";$("#del").classList.remove("ask");$("#del").hidden=!(sel.id&&assets&&db);$("#lb").classList.add("on")};
$("#del").onclick=async e=>{e.stopPropagation();const d=$("#del");
 if(!d.classList.contains("ask")){d.classList.add("ask");d.textContent="もう一度押すと削除";return}
 try{await db.collection("photos").doc(sel.id).delete();await assets.delete(sel.id)}catch(x){}
 $("#lb").classList.remove("on")};
$("#lb").onclick=()=>$("#lb").classList.remove("on");
</script>
</body>
</html>

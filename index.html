.sea i{display:none}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(min(44vw,190px) + 28px) 20px calc(104px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.wrap{padding-top:calc(190px + 40px)}}
/* flat sections: no cards */
.glass{background:none;border:0;border-radius:0;box-shadow:none}
header{position:relative;padding:0 0 28px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.shisa{position:absolute;top:30px;right:clamp(16px,6vw,32px);width:clamp(76px,24%,96px);height:auto;pointer-events:none}
.date{font-family:var(--serif);font-size:.85rem;font-weight:500;color:var(--sub);letter-spacing:.2em;margin:0}
h1{font-family:var(--serif);font-weight:700;font-size:2.2rem;line-height:1.3;margin:8px 0 22px;letter-spacing:.14em;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips a{display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 8px 9px 10px;border:1px solid var(--teal);border-radius:0;color:var(--teal-d);background:rgba(17,128,141,.08);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:rgba(17,128,141,.45);letter-spacing:.02em;min-height:44px;white-space:nowrap}
.chips a svg,#dr a svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips a:hover,.chips a:active{background:var(--teal);color:#fff;text-decoration-color:transparent}
.chips li{font-size:clamp(.7rem,3.3vw,.85rem);font-weight:500;flex:1 1 auto}
@media (max-width:380px){.chips{gap:5px}.chips li{font-size:3vw}.chips a{padding:9px 5px 9px 7px;gap:3px;letter-spacing:0}.chips a svg{width:11px;height:11px}}
button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--rose);outline-offset:2px}
section[hidden]{display:none}
.days{display:flex;gap:8px;margin-bottom:26px}
.days button{flex:1;padding:10px 4px;border:1px solid var(--teal);border-radius:0;background:transparent;color:var(--teal-d);font:500 .85rem/1.4 var(--sans);letter-spacing:.04em;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
.day{padding:0}
.day h2{font-family:var(--serif);font-size:1.4rem;line-height:1.55;margin:0 0 4px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
.day p.d{margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line);color:var(--sub);font-size:.82rem;letter-spacing:.12em}
.tl{list-style:none;margin:0;padding:0 0 0 20px;border-left:1px solid var(--line)}
.tl li{position:relative;display:flex;gap:14px;padding:9px 0}
.tl li::before{content:"";position:absolute;left:-25px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--teal)}
.tl li.t::before{background:var(--rose);border-color:var(--rose)}
.tm{flex:0 0 3.6rem;font-family:var(--serif);font-weight:700;color:var(--rose);font-size:1rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tm.n{color:var(--sub);font-weight:400}
.tl li>span:last-child{font-size:.98rem}
.pk{padding:0;margin-bottom:20px}
.pk h2{font-family:var(--serif);font-size:1.3rem;letter-spacing:.12em;margin:0 0 6px;color:var(--ink)}
.pk label{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border-radius:0;background:transparent;border:1.5px solid var(--teal);display:grid;place-content:center;margin:0}
.pk input:checked{background:var(--teal)}
.pk input:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.pk input:checked+span{opacity:.45;text-decoration:line-through}
.prog{padding:0 0 18px;margin-bottom:8px;font-size:.88rem;letter-spacing:.08em;color:var(--sub)}
.bar{height:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.add{display:inline-block;padding:11px 26px;border-radius:0;background:var(--teal);color:#fff;font-weight:700;letter-spacing:.1em;cursor:pointer;margin-bottom:10px;text-decoration:none}
.add:hover{background:var(--teal-d)}
.add input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.78rem;color:var(--sub);margin:0 0 16px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{padding:0;border:0;border-radius:0;overflow:hidden;aspect-ratio:1;cursor:pointer;background:var(--line)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.empty{padding:40px 20px;text-align:center;color:var(--sub);border:1px dashed var(--line);letter-spacing:.1em}
#lb{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(15,28,33,.95);padding:20px}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:100%}
#del{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);border:0;border-radius:0;padding:12px 26px;background:#fff;color:var(--ink);font:700 .92rem var(--sans);letter-spacing:.08em;cursor:pointer}

/* bottom tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:rgba(248,242,243,.97);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--sub);font:500 .68rem var(--sans);letter-spacing:.04em;padding:9px 2px 8px;cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--teal-d);font-weight:700;border-top-color:var(--teal)}
/* hamburger */
#mb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:30;width:44px;height:44px;border:0;border-radius:6px;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer}
#mb svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;fill:none}
#dr{position:fixed;inset:0;z-index:40;background:rgba(20,35,40,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#dr.on{opacity:1;pointer-events:auto}
#dr .pn{position:absolute;top:0;right:0;bottom:0;width:min(80%,300px);background:var(--paper);padding:calc(env(safe-area-inset-top,0px) + 20px) 22px 24px;transform:translateX(100%);transition:transform .25s;overflow-y:auto}
#dr.on .pn{transform:none}
#dr h2{font-family:var(--serif);font-size:1.1rem;letter-spacing:.14em;margin:0 0 10px}
#dr a,#dr .go{display:block;width:100%;text-align:left;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:500 .95rem var(--sans);letter-spacing:.06em;text-decoration:none;cursor:pointer}
#dr a{display:flex;align-items:center;justify-content:space-between;gap:10px}
#dr .sub{margin:22px 0 4px;font-size:.75rem;color:var(--sub);letter-spacing:.14em}
/* cost / todo */
.sum{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.sum div{flex:1;padding:16px 0}
.sum div+div{border-left:1px solid var(--line);padding-left:18px}
.sum small{display:block;font-size:.75rem;color:var(--sub);letter-spacing:.12em}
.sum b{font-family:var(--serif);font-size:1.7rem;color:var(--ink);letter-spacing:.02em}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.f input,.pn2 input{font:400 1rem var(--sans);color:var(--ink);border:1px solid var(--line);border-radius:0;background:#fff;padding:11px 12px;min-width:0;width:100%}
.f input:first-child{grid-column:1/-1}
.f button,.ln button.b{border:0;background:var(--teal);color:#fff;font:700 .95rem var(--sans);letter-spacing:.1em;padding:11px;cursor:pointer}
.f button{grid-column:1/-1}
.cn{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:.9rem;color:var(--sub)}
.cn input{width:5rem;border:1px solid var(--line);border-radius:0;padding:8px 10px;font:400 1rem var(--sans);background:#fff;color:var(--ink)}
ul.ln{list-style:none;margin:0 0 16px;padding:0}
ul.ln li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
ul.ln .t{flex:1;min-width:0;overflow-wrap:anywhere}
ul.ln small{display:block;color:var(--sub);font-size:.78rem}
ul.ln .m{font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums}
ul.ln .x{border:0;background:none;color:var(--sub);font-size:1.4rem;line-height:1;padding:6px 8px;cursor:pointer}
.bal{font-size:.85rem;color:var(--sub);line-height:1.9}
.bal b{color:var(--ink)}
.td{display:flex;gap:8px;margin-bottom:16px}
.td input[type=text]{flex:1;font:400 1rem var(--sans);color:var(--ink);border:1px solid var(--line);border-radius:0;background:#fff;padding:11px 12px;min-width:0}
.td button{border:0;background:var(--teal);color:#fff;font:700 .95rem var(--sans);letter-spacing:.1em;padding:0 18px;cursor:pointer}
ul.ln label{display:flex;gap:14px;align-items:center;flex:1;cursor:pointer;min-width:0}
ul.ln input[type=checkbox]{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;background:transparent;border:1.5px solid var(--teal);display:grid;place-content:center;margin:0}
ul.ln input[type=checkbox]:checked{background:var(--teal)}
ul.ln input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
ul.ln input:checked+span{opacity:.45;text-decoration:line-through}
.nv,#lx{position:absolute;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:var(--ink);font-size:1.7rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.nv{top:50%;transform:translateY(-50%)}
#lp{left:8px}#ln{right:8px}
#lx{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;padding:0 0 2px}
#lc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;transform:translateX(-50%);color:#fff;font-size:.85rem;letter-spacing:.12em}
#lb img{max-height:78%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){h1{font-size:2.7rem}.shisa{top:36px}}
@media (max-width:340px){.shisa{width:66px;right:0}}
</style>
</head>

const P=[["持ち物",["Apple Watch", "帽子", "モバイルバッテリー", "ケープ", "歯ブラシ", "扇風機", "日傘", "小さいカバン", "水着", "下着", "服", "パック", "充電コード", "メガネ", "口のテープ", "ヘアゴム", "スキンケア", "ドライヤー", "サンダル", "財布", "ハンカチティッシュ", "iPad", "ヘアオイル"]]];
const $=s=>document.querySelector(s);
let cur=0;
function day(i){cur=i;const x=D[i];
 $("#days").innerHTML=D.map((y,j)=>`<button aria-pressed="${j==i}" data-i="${j}">${y.k}<br>${y.d}</button>`).join("");
 $("#day").innerHTML=`<h2>${x.t}</h2><p class="d">${x.k} ・ ${x.d}</p><ul class="tl">`+x.s.map(r=>`<li class="${r[2]?"t":""}"><span class="tm ${r[0]?"":"n"}">${r[0]||"〜"}</span><span>${r[1]}</span></li>`).join("")+`</ul>`}
$("#days").onclick=e=>{const b=e.target.closest("button");if(b)day(+b.dataset.i)};
day(0);
let st={};try{st=JSON.parse(localStorage.getItem("ishigaki-pack")||"{}")}catch(e){}
$("#pl").innerHTML=P.map((c,i)=>`<div class="pk glass"><h2>${c[0]}</h2>`+c[1].map((n,j)=>`<label><input type="checkbox" data-k="${i}-${j}" ${st[i+"-"+j]?"checked":""}><span>${n}</span></label>`).join("")+`</div>`).join("");
function prog(){const a=[...document.querySelectorAll(".pk input")],n=a.filter(x=>x.checked).length;
 $("#pt").textContent=`準備 ${n} / ${a.length} 完了`;$("#pb").style.width=(n/a.length*100)+"%"}
$("#pl").onchange=e=>{st[e.target.dataset.k]=e.target.checked;try{localStorage.setItem("ishigaki-pack",JSON.stringify(st))}catch(x){}prog()};
prog();
const TABS=["trip","pack","cost","todo","gal"];
function show(t){document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab==t));
 TABS.forEach(id=>$("#"+id).hidden=id!=t);document.querySelector("header").hidden=t!="trip";window.scrollTo(0,0);if(t=="gal"&&window.pullPhotos)pullPhotos()}
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.tab)};
const mb=$("#mb"),dr=$("#dr");
function mo(o){dr.classList.toggle("on",o);mb.setAttribute("aria-expanded",o);mb.setAttribute("aria-label",o?"メニューを閉じる":"メニューを開く")}
mb.onclick=()=>mo(!dr.classList.contains("on"));
dr.onclick=e=>{const g=e.target.closest("[data-go]");if(g){show(g.dataset.go);mo(false)}else if(e.target===dr||e.target.closest("a"))mo(false)};
document.onkeydown=e=>{if(e.key==="Escape")mo(false)};
function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
/* shared data (Firebase Realtime Database, REST) */
const DB="https://ishigaki-trip-1f505-default-rtdb.asia-southeast1.firebasedatabase.app/trip_q7Xk2mP9vL4dW8sZ";
let snap=ld("ishigaki-snap",{}),last="";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function api(path,method,body){const o={method:method||"GET"};if(body!==undefined){o.headers={"Content-Type":"application/json"};o.body=JSON.stringify(body)}
 const r=await fetch(DB+path+".json",o);if(!r.ok)throw new Error(r.status);return r.json()}
function status(ok){document.querySelectorAll(".sync").forEach(e=>e.textContent=ok?"みんなで共有中。変更は自動で反映されます。":"通信できません。電波を確認して、ページを再読み込みしてください。")}
const items=o=>Object.keys(o||{}).sort().map(k=>Object.assign({id:k},o[k]));
function rc(){const c=snap.cost||{},n=Math.max(1,c.n||2),L=$("#cl");L.innerHTML="";let tot=0,by={};
 if(document.activeElement!==$("#cn"))$("#cn").value=n;
 items(c.items).forEach(it=>{tot+=it.a;if(it.w)by[it.w]=(by[it.w]||0)+it.a;
  const li=el("li"),t=el("div","t",it.n);if(it.w)t.appendChild(el("small",0,it.w+"さんが支払い"));
  const x=el("button","x","×");x.setAttribute("aria-label",it.n+"を削除");
  x.onclick=()=>{delete snap.cost.items[it.id];draw();api("/cost/items/"+it.id,"DELETE").catch(()=>status(false))};
  li.append(t,el("div","m",yen(it.a)),x);L.appendChild(li)});
 const per=tot/n;$("#ct").textContent=yen(tot);$("#cp").textContent=yen(Math.ceil(per));
 const B=$("#cb");B.innerHTML="";const ks=Object.keys(by);
 if(ks.length){B.appendChild(el("div",0,"支払った人ごとの精算の目安"));
  ks.forEach(k=>{const d=by[k]-per,r=el("div");r.append(document.createTextNode(k+"さん　立替 "+yen(by[k])+"　"));
   r.appendChild(el("b",0,d>=0?"受け取り "+yen(d):"支払い "+yen(-d)));B.appendChild(r)})}}
function rt(){const L=$("#tl");L.innerHTML="";
 items(snap.todo).forEach(it=>{const li=el("li"),lb=el("label"),cb=document.createElement("input");cb.type="checkbox";cb.checked=!!it.d;
  cb.onchange=()=>{it.d=cb.checked?1:0;snap.todo[it.id].d=it.d;draw();api("/todo/"+it.id+"/d","PUT",it.d).catch(()=>status(false))};
  lb.append(cb,el("span",0,it.t));
  const x=el("button","x","×");x.setAttribute("aria-label",it.t+"を削除");
  x.onclick=()=>{delete snap.todo[it.id];draw();api("/todo/"+it.id,"DELETE").catch(()=>status(false))};
  li.append(lb,x);L.appendChild(li)})}
function draw(){rc();rt();sv("ishigaki-snap",snap)}
async function pull(){try{let [c,t,m]=await Promise.all([api("/cost"),api("/todo"),api("/meta")]);
 if(!(m&&m.seeded)){await api("","PATCH",{"todo/d1":{t:"ひとし　予約確認",d:0},"todo/d2":{t:"星空ツアー　予約・集合時間を確認",d:0},"meta/seeded":true});t=await api("/todo")}
 status(true);const d={};if(c)d.cost=c;if(t)d.todo=t;const j=JSON.stringify(d);if(j===last)return;last=j;snap=d;draw()}catch(e){status(false)}}
$("#cn").oninput=e=>{const v=Math.max(1,parseInt(e.target.value)||1);snap.cost=snap.cost||{};snap.cost.n=v;rc();api("/cost/n","PUT",v).catch(()=>status(false))};
$("#cadd").onclick=()=>{const n=$("#ci").value.trim(),a=parseInt($("#ca").value);if(!n||!(a>=0))return;
 const id=uid(),v={n:n,a:a};const w=$("#cw").value.trim();if(w)v.w=w;
 snap.cost=snap.cost||{};snap.cost.items=snap.cost.items||{};snap.cost.items[id]=v;draw();
 api("/cost/items/"+id,"PUT",v).catch(()=>status(false));$("#ci").value="";$("#ca").value=""};
$("#tadd").onclick=()=>{const v=$("#ti").value.trim();if(!v)return;const id=uid();
 snap.todo=snap.todo||{};snap.todo[id]={t:v,d:0};draw();api("/todo/"+id,"PUT",{t:v,d:0}).catch(()=>status(false));$("#ti").value=""};
draw();pull();setInterval(()=>{if(!document.hidden)pull()},5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});

const REPO="cherblo17/ishigaki-trip";
let gh=[],fbids=[],fbt={},cache={},idx=0,pstate="load",tx=null;
const all=()=>[...fbids.filter(i=>fbt[i]).map(i=>({src:"fb",id:i,t:fbt[i]})),...gh.map(x=>({src:"gh",name:x.name,t:x.u}))];
function render(){const a=all();$("#g").innerHTML=a.map((p,i)=>`<button data-i="${i}"><img loading="lazy" src="${p.t}" alt="旅行の写真"></button>`).join("");
 $("#ge").hidden=a.length>0||pstate!=="ok";
 if(!busy)$("#gn").textContent=pstate==="err"?"写真を読み込めませんでした。電波を確認して、再読み込みしてください。":"写真はみんなで共有されます。"+(a.length?"　"+a.length+"枚":"")}
let busy=false;
async function pullPhotos(){try{const r=await fetch(DB+"/thumbs.json?shallow=true");if(!r.ok)throw 0;
 const ids=Object.keys(await r.json()||{}).sort().reverse();
 const miss=ids.filter(i=>!fbt[i]);
 if(miss.length>3){Object.assign(fbt,await api("/thumbs")||{})}
 else await Promise.all(miss.map(async i=>{const t=await api("/thumbs/"+i);if(t)fbt[i]=t}));
 fbids=ids;pstate="ok"}catch(e){if(pstate!=="ok")pstate="err"}render()}
async function loadGh(){try{const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/photos?ref=main");if(!r.ok)return;
 const j=await r.json();gh=j.filter(x=>x.type==="file"&&/\.(jpe?g|png|gif|webp)$/i.test(x.name)).map(x=>({name:x.name,u:x.download_url}));render()}catch(e){}}
function bmp(f){return createImageBitmap(f).catch(()=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)}))}
function enc(im,max,q){const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
$("#f").onchange=async e=>{const fs=[...e.target.files];e.target.value="";let n=0,ng=0;busy=true;
 for(const f of fs){$("#gn").textContent="アップロード中 "+(++n)+" / "+fs.length;
  try{const im=await bmp(f),id=uid(),full=enc(im,1600,.8),th=enc(im,360,.7);
   await api("/photos/"+id,"PUT",full);await api("/thumbs/"+id,"PUT",th);fbt[id]=th;cache[id]=full;fbids.unshift(id);render()}catch(x){ng++}}
 busy=false;await pullPhotos();if(ng)$("#gn").textContent=ng+"枚を追加できませんでした。"};
async function openPhoto(i){const a=all();if(!a.length)return;idx=(i+a.length)%a.length;const it=a[idx];
 $("#lb").classList.add("on");$("#lc").textContent=(idx+1)+" / "+a.length;$("#lb img").src=it.t;
 $("#lp").hidden=$("#ln").hidden=a.length<2;const d=$("#del");d.classList.remove("ask");d.textContent=it.src==="gh"?"GitHubで削除":"削除";
 if(it.src==="fb"){let f=cache[it.id];if(!f){try{f=await api("/photos/"+it.id);if(f)cache[it.id]=f}catch(e){}}
  if(f&&idx===i&&$("#lb").classList.contains("on"))$("#lb img").src=f}}
$("#g").onclick=e=>{const b=e.target.closest("button");if(b)openPhoto(+b.dataset.i)};
$("#lp").onclick=()=>openPhoto(idx-1);$("#ln").onclick=()=>openPhoto(idx+1);
$("#lx").onclick=()=>$("#lb").classList.remove("on");
$("#lb").onclick=e=>{if(e.target===$("#lb"))$("#lb").classList.remove("on")};
$("#lb").ontouchstart=e=>{tx=e.touches[0].clientX};
$("#lb").ontouchend=e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)openPhoto(idx+(dx<0?1:-1))};
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;if(e.key==="ArrowLeft")openPhoto(idx-1);if(e.key==="ArrowRight")openPhoto(idx+1)});
$("#del").onclick=async()=>{const it=all()[idx],d=$("#del");if(!it)return;
 if(it.src==="gh"){window.open("https://github.com/"+REPO+"/delete/main/photos/"+encodeURIComponent(it.name),"_blank","noopener");return}
 if(!d.classList.contains("ask")){d.classList.add("ask");d.textContent="もう一度押すと削除";return}
 try{await api("/photos/"+it.id,"DELETE");await api("/thumbs/"+it.id,"DELETE");fbids=fbids.filter(x=>x!==it.id);delete fbt[it.id];delete cache[it.id]}catch(e){}
 $("#lb").classList.remove("on");render()};
loadGh();pullPhotos();
setInterval(()=>{if(!document.hidden&&!$("#gal").hidden)pullPhotos()},8000);
</script>
